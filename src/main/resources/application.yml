
default-properties:
  current-play:
    current-play-cache-duration: 1h
    current-data-key-index: "CurrentPlayIndex:"
    game-status-check-interval: 5m
    current-play-fields: "currentPlay,count,balls,strikes,outs,matchup,batter,pitcher,id,fullName,pitchIndex,runnerIndex,runners,movement,originBase,start,end,outBase,isOut,details,event,eventType,runner,isScoringEvent,playEvents,description,isStrike,isBall,isInPlay,index,atBatIndex,inning, type,code,pitchData,startSpeed,endSpeed"
    all-play-fields: "allPlays,count,pitchNumber,about,inning,balls,strikes,outs,matchup,batter,pitcher,id,fullName,pitchIndex,runnerIndex,runners,movement,originBase,start,end,outBase,isOut,details,event,eventType,runner,isScoringEvent,playEvents,description,isStrike,isBall,isInPlay,index,atBatIndex,type,code,isTopInning,isComplete,pitchData,startSpeed,endSpeed,result"
  play-info:
    line-up-fields: "teams,away,home,batters,pitchers,bullpen,battingOrder"
    defense-location-fields: "defense,catcher,first,second,third,shortstop,left,right,center,id"
    defense-location-index: "DefenseLocationIndex:"
    match-start-polling-limit: 12h
    delay-before-start-limit: 12h
    delay-in-game-limit: 6h
    ended-match-disconnect-delay: 10m
    game-state-fields: "gameData,status,abstractGameState,detailedState,reason,datetime,dateTime,liveData,linescore,teams,home,away,runs"
  team-properties:
    team-data-fields: "teams,id,name,season,division,id,shortName"
    al-west-code: 200
    al-east-code: 201
    al-central-code: 202
    nl-west-code: 203
    nl-east-code: 204
    nl-central-code: 205
  player-properties:
    player-data-fields: "roster,person,id,position,code,status,code,parentTeamId,jerseyNumber,fullName"
    season-stats-fields: "stats,splits,season,stat,avg,obp,slg,ops,era,whip,team,id,player"
    #시즌 스탯 배치 실행 시각 (UTC 15:00 = KST 00:00, 미국 경기 종료 이후). [미결] 일일 마감 시각 확정 시 변경
    stats-batch-cron: "0 0 15 * * *"
  #외부 API 재시도: 5s -> 10s -> 20s ... 상한 60s
  mlb-api-retry:
    initial-delay: 5s
    max-delay: 60s
    #[미결] 재시도 한도 수치. 확정 전 임시값
    max-attempts: 5

jwt:
  expire-ms: 3600000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mlbbroadcast
    username: root
    password: link5707
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: scheduledtasks
auth:
  register-temp-token-duration: 15m